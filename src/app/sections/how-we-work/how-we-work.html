<section class="bg-stone-50 py-24">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <app-section-heading
      kicker="Tu primera consulta"
      title="Cómo trabajamos"
      subtitle="Un proceso claro, pensado para reducir la incertidumbre desde el primer contacto y darte respuestas honestas antes de comprometerte con nada."
    />

    <div class="mt-16 grid gap-10 lg:grid-cols-3">
      @for (step of steps; track step.number; let last = $last) {
        <div class="relative">
          <span class="font-serif-display text-6xl font-semibold text-gold-500/25">{{ step.number }}</span>
          <h3 class="mt-4 font-serif-display text-xl font-semibold text-navy-900">{{ step.title }}</h3>
          <p class="mt-3 text-base leading-relaxed text-navy-700">{{ step.description }}</p>
          @if (!last) {
            <span class="absolute right-[-1.25rem] top-8 hidden h-px w-10 bg-navy-900/10 lg:block"></span>
          }
        </div>
      }
    </div>
  </div>
</section>
